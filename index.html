<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>4-Zone HVAC Control — Casaria</title>
<script src="marked.min.js"></script>
<style>
  :root {
    --accent: #0d9488;
    --accent-dark: #0f766e;
    --accent-soft: #effbf9;
    --ink: #1a1f26;
    --ink-soft: #4b5563;
    --line: #e5e7eb;
    --bg: #ffffff;
    --bg-alt: #fafafa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.65;
  }
  a { color: var(--accent-dark); }

  header.site-nav {
    position: sticky; top: 0; z-index: 10;
    background: rgba(255,255,255,0.92);
    backdrop-filter: saturate(180%) blur(6px);
    border-bottom: 1px solid var(--line);
  }
  .nav-inner {
    max-width: 1040px; margin: 0 auto; padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; flex-shrink: 0; }
  .brand .wordmark { font-weight: 700; letter-spacing: 0.06em; font-size: 0.78rem; color: var(--ink-soft); text-transform: uppercase; }
  .brand .project-name { font-weight: 700; font-size: 1.05rem; color: var(--ink); }
  nav.links { display: flex; gap: 22px; overflow-x: auto; min-width: 0; flex-shrink: 1; scrollbar-width: thin; }
  nav.links a {
    color: var(--ink-soft); text-decoration: none; font-size: 0.88rem; font-weight: 500;
    white-space: nowrap; padding: 4px 0; border-bottom: 2px solid transparent;
  }
  nav.links a:hover { color: var(--ink); border-bottom-color: var(--accent); }
  .cta {
    background: var(--accent); color: white; padding: 8px 16px; border-radius: 6px;
    font-size: 0.85rem; font-weight: 600; text-decoration: none; white-space: nowrap;
    flex-shrink: 0;
  }
  .cta:hover { background: var(--accent-dark); color: white; }

  .hero {
    position: relative; overflow: hidden;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
    color: white; padding: 72px 24px 64px;
  }
  .hero-pattern { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hero-inner { position: relative; max-width: 1040px; margin: 0 auto; }
  .eyebrow {
    text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.78rem;
    font-weight: 700; opacity: 0.85; margin-bottom: 14px;
  }
  .hero h1 { font-size: 2.4rem; margin: 0 0 12px; line-height: 1.15; }
  .hero p.tagline { font-size: 1.1rem; opacity: 0.92; max-width: 560px; margin: 0; }

  main { max-width: 760px; margin: 0 auto; padding: 56px 24px 96px; }
  #content h2 {
    font-size: 1.5rem; margin-top: 2.6em; padding-top: 0.6em;
    border-top: 1px solid var(--line); color: var(--ink);
  }
  #content h2:first-of-type { margin-top: 0; border-top: none; padding-top: 0; }
  #content h3 { color: var(--ink-soft); font-size: 1.05rem; font-weight: 600; margin-top: 0; }
  #content hr { border: none; border-top: 1px solid var(--line); margin: 2em 0; }
  #content p { color: var(--ink); }
  #content code {
    background: var(--accent-soft); color: var(--accent-dark); padding: 0.15em 0.4em;
    border-radius: 4px; font-size: 0.88em; font-family: "SF Mono", Menlo, Consolas, monospace;
  }
  #content pre {
    background: #0f1115; color: #e5e7eb; padding: 18px 20px; border-radius: 8px;
    overflow-x: auto; font-size: 0.85rem;
  }
  #content pre code { background: none; color: inherit; padding: 0; }
  #content table { width: 100%; border-collapse: collapse; margin: 1.2em 0; font-size: 0.92rem; }
  #content th, #content td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  #content th { color: var(--ink-soft); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; }
  #content tr:hover td { background: var(--bg-alt); }
  #content a { color: var(--accent-dark); }
  #content ul, #content ol { padding-left: 1.3em; }
  #content li { margin: 0.3em 0; }

  .loading { color: var(--ink-soft); font-size: 0.9rem; }

  footer {
    border-top: 1px solid var(--line); background: var(--bg-alt);
    padding: 28px 24px; text-align: center; color: var(--ink-soft); font-size: 0.82rem;
  }
  footer .accent-dot { color: var(--accent); }

  @media (max-width: 640px) {
    nav.links { display: none; }
    .hero h1 { font-size: 1.9rem; }
  }
</style>
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <div class="brand">
      <span class="wordmark">Casaria</span>
      <span class="project-name">4-Zone HVAC Control</span>
    </div>
    <nav class="links">
      <a href="#overview">Overview</a>
      <a href="#zone-layout">Zone layout</a>
      <a href="#fan-logic">Fan logic</a>
      <a href="#damper-logic">Damper logic</a>
      <a href="#implementation">Implementation</a>
      <a href="#status">Status</a>
    </nav>
    <a class="cta" href="#overview">View spec</a>
  </div>
</header>

<section class="hero">
  <svg class="hero-pattern" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <g fill="none" stroke="white" stroke-width="1.5" opacity="0.35">
        <path d="M-20 60 Q 40 20, 100 60 T 220 60 T 340 60 T 460 60" />
        <path d="M-20 110 Q 40 70, 100 110 T 220 110 T 340 110 T 460 110" />
        <path d="M-20 160 Q 40 120, 100 160 T 220 160 T 340 160 T 460 160" />
      </g>
    </svg>
  <div class="hero-inner">
    <div class="eyebrow">Casaria &middot; Project</div>
    <h1 id="overview">4-Zone HVAC Control</h1>
    <p class="tagline">A YAML spec for ducted zone control off one Daikin unit</p>
  </div>
</section>

<main>
  <div id="content" class="loading">Loading content&hellip;</div>
</main>

<footer>
  <span class="accent-dot">&#9679;</span>&nbsp; 4-Zone HVAC Control &mdash; part of the Casaria home systems projects
</footer>

<script>
  fetch('content.md')
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(function(md) {
      document.getElementById('content').classList.remove('loading');
      document.getElementById('content').innerHTML = marked.parse(md);
    })
    .catch(function(err) {
      document.getElementById('content').innerHTML =
        '<p class="loading">Could not load content.md (' + err.message + ').' +
        ' If you opened this file directly, serve the folder over HTTP instead ' +
        '(e.g. <code>python3 -m http.server</code>) &mdash; browsers block local file fetches.</p>';
    });
</script>

</body>
</html>
